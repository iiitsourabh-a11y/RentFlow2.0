name: RentFlow 2.0 CI

on:
  push:
    branches: [ main, audit-start ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Build & Test (Java 21 / Spring Boot 4)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Run Backend Tests & Package
        working-directory: backend
        run: ./mvnw -B clean verify

  frontend-check:
    name: Frontend Lint & Build (React 19 / TypeScript / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Linting (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Build Production Bundle (tsc + vite)
        working-directory: frontend
        run: npm run build
