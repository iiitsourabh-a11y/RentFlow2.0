spring.application.name=rentflow-backend

server.port=${PORT:8080}

# Database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/rentflow}
spring.datasource.username=${DB_USERNAME:rentflow_user}
# In production, DB_PASSWORD must be provided via environment variable (no insecure fallback)
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Database migrations
spring.flyway.enabled=true

# Actuator configuration - expose ONLY health endpoint; never leak internal details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT configuration
# In production, JWT_SECRET must be provided via environment variable (minimum 256-bit Base64)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# CORS configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
