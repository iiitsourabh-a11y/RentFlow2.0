# =============================================================================
# Test configuration – uses H2 in-memory database, no Flyway migrations
# =============================================================================

spring.application.name=rentflow-backend

# H2 in-memory database with PostgreSQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Let Hibernate create the schema from entities (since Flyway is disabled)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Disable Flyway for tests – H2 cannot run the PostgreSQL-specific migrations
spring.flyway.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# JWT – dummy Base64-encoded 256-bit key (DO NOT use in production)
app.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1yZW50Zmxvdy1kZXYtb25seS0xMjM0NTY3ODkw
app.jwt.expiration-ms=600000
